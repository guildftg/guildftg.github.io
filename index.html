    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="&lt;FTG&gt;" />

      content="FTG is a Horde raiding guild on Dreamscythe running two 25-man progression teams."
    />
    <meta property="og:url" content="https://www.ftgguild.com/" />
    <meta property="og:image" content="https://www.ftgguild.com/og-image.png" />

      name="twitter:description"

    <link rel="icon" type="image/png" href="/src/assets/images/art/ftg_logo_128.png" />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("ftg-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-bs-theme", theme);
          }
        } catch (error) {
          document.documentElement.removeAttribute("data-bs-theme");
        }
      })();
    </script>
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <title>FTG - Dreamscythe Horde Raiding Guild</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
