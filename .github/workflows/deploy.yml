name: Deploy to GitHub Pages

# Replaces the old workflow of building locally and dragging dist/ into the
# `pages` branch by hand. Every push to main now builds and deploys through
# Pages' native GitHub Actions integration - no `pages` branch involved.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger a redeploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a second push while one is running waits
# instead of racing it, but never gets cancelled mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + SSR prerender)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
