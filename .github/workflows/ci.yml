name: CI

# Build-only check on pull requests into main - catches a broken build (or a
# component that isn't SSR-safe) before it merges, without deploying anything.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + SSR prerender)
        run: npm run build
